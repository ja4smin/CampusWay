<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusWay Indoor Test — Madriga</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#0D1B3E}
header{background:white;border-bottom:1px solid #d7e0ea;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;margin-right:10px}.brand b{color:#0891B2}
select,button{font:inherit;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;background:white}
select{min-width:220px}button{cursor:pointer;font-weight:700}#go{background:#0891B2;color:white;border-color:#0891B2}
#status{font-size:13px;color:#64748b;margin-left:auto}
main{display:grid;grid-template-columns:minmax(0,1fr) 280px;height:calc(100vh - 68px)}
.map{position:relative;overflow:hidden;background:#e8eef5}
#viewport{width:100%;height:100%;overflow:auto;cursor:grab}#viewport.dragging{cursor:grabbing;user-select:none}
#stage{position:relative;display:inline-block}#floorImg{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#routeSvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#floors{position:absolute;z-index:3;left:12px;top:12px;display:flex;gap:5px;background:rgba(255,255,255,.96);padding:6px;border-radius:10px;border:1px solid #d7e0ea}
#floors button{border:0;padding:7px 10px}#floors button.active{background:#0D1B3E;color:white}
#zoom{position:absolute;z-index:3;right:12px;bottom:12px;display:flex;gap:4px;background:white;padding:5px;border:1px solid #d7e0ea;border-radius:10px}
aside{background:white;border-left:1px solid #d7e0ea;padding:16px;overflow:auto}
.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:12px;margin-bottom:12px}
.step{border-left:3px solid #0891B2;padding:7px 10px;margin:7px 0;font-size:14px}.muted{font-size:13px;color:#64748b}
@media(max-width:820px){main{grid-template-columns:1fr;height:auto}.map{height:65vh}aside{border-left:0;border-top:1px solid #d7e0ea}select{min-width:150px;flex:1}}
</style>
</head>
<body>
<header>
  <div class="brand">Campus<b>Way</b></div>
  <select id="building">
  <option value="madriga">Madriga</option>
  <option value="education">Education</option>
  <option value="main">Main</option>
  <option value="multi-purpose">Multi-Purpose</option>
  <option value="rabin">Rabin</option>
  <option value="student">Student</option>
</select>
  <select id="from"><option value="">From...</option></select>
  <button id="swap">⇄</button>
  <select id="to"><option value="">To...</option></select>
  <button id="go">Find route</button>
  <button id="clear">Clear</button>
  <span id="status">Choose two locations.</span>
</header>
<main>
  <section class="map">
    <div id="floors"></div>
    <div id="viewport"><div id="stage">
      <img id="floorImg" alt="Floor plan">
      <svg id="routeSvg"></svg>
    </div></div>
    <div id="zoom"><button id="minus">−</button><button id="reset">100%</button><button id="plus">+</button></div>
  </section>
  <aside>
    <h3>Route</h3>
    <div class="card" id="summary"><b>No route yet</b><div class="muted">Choose a start and destination.</div></div>
    <div id="steps"></div>
    <div class="muted">Test page using your WayFrame graph. Switch floors with the buttons to inspect each route segment.</div>
  </aside>
</main>
<script>
let GRAPH = null;
let BUILDING = 'madriga';
let IMAGES = {};

async function loadGraph(){
  const response = await fetch(
    `../buildings/${BUILDING}/${BUILDING}-indoor-graph.json`
  );

  if(!response.ok){
    throw new Error(`Could not load ${BUILDING} indoor graph`);
  }

  GRAPH = await response.json();
IMAGES = {
  floor1: `../buildings/${BUILDING}/floors/floor1.svg`,
  floor2: `../buildings/${BUILDING}/floors/floor2.svg`,
  floor3: `../buildings/${BUILDING}/floors/floor3.svg`,
  floor0: `../buildings/${BUILDING}/floors/floor0.svg`,
  floor4: `../buildings/${BUILDING}/floors/floor4.svg`,
  floorminus1: `../buildings/${BUILDING}/floors/floorminus1.svg`
};

  floor = Object.keys(GRAPH.floors)[0] || 'floor1';

  locations();
  tabs();
  setFloor(floor);
}

document.getElementById('building').onchange = async () => {
  BUILDING = document.getElementById('building').value;
  await loadGraph();
};

const ORDER = [
  'floorminus1',
  'floor0',
  'floor1',
  'floor2',
  'floor3',
  'floor4',
  'floor5',
  'floor6',
  'floor7',
  'floor500',
  'floor600',
  'floor700'
];
let floor = 'floor1', path = [], zoom = 1;
const $=id=>document.getElementById(id), img=$('floorImg'), svg=$('routeSvg'), viewport=$('viewport');

function flabel(f){return f==='floorminus1'?'−1':f.replace('floor','')}
function allNodes(){return Object.values(GRAPH.floors).flatMap(f=>f.nodes||[])}
function nodeById(id){for(const f of Object.values(GRAPH.floors)){const n=(f.nodes||[]).find(x=>x.id===id);if(n)return n}return null}
function cid(n){const s=String(n.connectorId||'').trim();return (!s||['null','none','no','n/a'].includes(s.toLowerCase()))?'':s}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}

function locations(){
const ns=allNodes().filter(n=>
  ['room','entrance','elevator','stairs','restroom','landmark','gym'].includes(n.type)
)
    .sort((a,b)=>ORDER.indexOf(a.floor)-ORDER.indexOf(b.floor)||a.label.localeCompare(b.label,undefined,{numeric:true}));
  const h=ns.map(n=>`<option value="${n.id}">Floor ${flabel(n.floor)} — ${esc(n.label)} (${n.type})</option>`).join('');
  $('from').innerHTML='<option value="">From...</option>'+h;$('to').innerHTML='<option value="">To...</option>'+h;
}
function tabs(){
  $('floors').innerHTML='';
  ORDER.filter(f=>GRAPH.floors[f]).forEach(f=>{
    const b=document.createElement('button');b.textContent=flabel(f);b.className=f===floor?'active':'';
    b.onclick=()=>setFloor(f);$('floors').appendChild(b);
  });
}
function floorImagePath(f){

  if(BUILDING === 'main'){
    const mainFiles = {
      floor500: '500-Model.svg',
      floor600: '600-Model.svg',
      floor700: '700-Model.svg'
    };

    return `../buildings/main/floors/${mainFiles[f]}`;
  }

  return `../buildings/${BUILDING}/floors/${f}.svg`;
}
function setFloor(f){if(!GRAPH.floors[f])return;floor=f;tabs();img.src = floorImagePath(f);$('status').textContent=path.length?`Viewing Floor ${flabel(f)} of active route`:`Viewing Floor ${flabel(f)}`}
img.onload=()=>{zoom=1;applyZoom();drawRoute()};img.onerror=()=>{$('status').textContent='Could not load '+IMAGES[floor]};
function applyZoom(){const w=img.naturalWidth||1200,h=img.naturalHeight||800;img.style.width=w*zoom+'px';img.style.height=h*zoom+'px';$('stage').style.width=w*zoom+'px';$('stage').style.height=h*zoom+'px';svg.setAttribute('width',w*zoom);svg.setAttribute('height',h*zoom);svg.setAttribute('viewBox',`0 0 ${w*zoom} ${h*zoom}`);$('reset').textContent=Math.round(zoom*100)+'%';drawRoute()}
function setZoom(z){zoom=Math.max(.5,Math.min(4,z));applyZoom()}
$('plus').onclick=()=>setZoom(zoom+.2);$('minus').onclick=()=>setZoom(zoom-.2);$('reset').onclick=()=>setZoom(1);
viewport.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom+(e.deltaY<0?.12:-.12))},{passive:false});
let drag=false,sx=0,sy=0,sl=0,st=0;
viewport.onmousedown=e=>{if(e.button!==0)return;drag=true;viewport.classList.add('dragging');sx=e.clientX;sy=e.clientY;sl=viewport.scrollLeft;st=viewport.scrollTop};
window.onmousemove=e=>{if(!drag)return;viewport.scrollLeft=sl-(e.clientX-sx);viewport.scrollTop=st-(e.clientY-sy)};
window.onmouseup=()=>{drag=false;viewport.classList.remove('dragging')};

function buildGraph(){
  const ns=allNodes(), by=new Map(ns.map(n=>[n.id,n])), adj=new Map(ns.map(n=>[n.id,[]]));
  for(const f of Object.values(GRAPH.floors)) for(const c of (f.connections||[])){
    const a=by.get(c.from),b=by.get(c.to);if(!a||!b)continue;const w=Math.hypot(a.x-b.x,a.y-b.y);
    adj.get(a.id).push({id:b.id,w});adj.get(b.id).push({id:a.id,w});
  }
  const groups=new Map();
  for(const n of ns){const c=cid(n);if(!c||!['stairs','elevator'].includes(n.type))continue;const k=n.type+':'+c;if(!groups.has(k))groups.set(k,new Map());const pf=groups.get(k);if(!pf.has(n.floor))pf.set(n.floor,[]);pf.get(n.floor).push(n)}
  for(const [k,pf] of groups){
    const fs=[...pf.keys()].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
    for(let i=0;i<fs.length-1;i++){const aL=pf.get(fs[i]),bL=pf.get(fs[i+1]);const a=aL[aL.length-1],b=bL[bL.length-1],w=.4;adj.get(a.id).push({id:b.id,w});adj.get(b.id).push({id:a.id,w})}
  }
  return {by,adj};
}
function dijkstra(start,end){
  const {by,adj}=buildGraph();if(!by.has(start)||!by.has(end))return null;
  const dist=new Map([...by.keys()].map(id=>[id,Infinity])),prev=new Map(),un=new Set(by.keys());dist.set(start,0);
  while(un.size){let cur=null,best=Infinity;for(const id of un){const d=dist.get(id);if(d<best){best=d;cur=id}}if(cur===null||best===Infinity)break;if(cur===end)break;un.delete(cur);
    for(const e of (adj.get(cur)||[])){if(!un.has(e.id))continue;const a=best+e.w;if(a<dist.get(e.id)){dist.set(e.id,a);prev.set(e.id,cur)}}}
  if(dist.get(end)===Infinity)return null;const p=[];let c=end;while(c!==undefined){p.unshift(c);if(c===start)break;c=prev.get(c)}return p[0]===start?p:null;
}
function drawRoute(){
  svg.innerHTML='';if(path.length<2||!img.complete)return;const w=img.offsetWidth,h=img.offsetHeight;
  for(let i=0;i<path.length-1;i++){const a=nodeById(path[i]),b=nodeById(path[i+1]);if(!a||!b||a.floor!==floor||b.floor!==floor)continue;
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a.x*w);l.setAttribute('y1',a.y*h);l.setAttribute('x2',b.x*w);l.setAttribute('y2',b.y*h);l.setAttribute('stroke','#00A67E');l.setAttribute('stroke-width',Math.max(6,7*zoom));l.setAttribute('stroke-linecap','round');svg.appendChild(l)}
}
function describe(p){
  const ns=p.map(nodeById).filter(Boolean),a=ns[0],b=ns.at(-1),floors=[...new Set(ns.map(n=>n.floor))];
  $('summary').innerHTML=`<b>${esc(a.label)} → ${esc(b.label)}</b><div class="muted">${floors.map(f=>'Floor '+flabel(f)).join(' → ')}</div>`;
  const s=[`Start at ${a.label} on Floor ${flabel(a.floor)}`];for(let i=1;i<ns.length;i++){if(ns[i-1].floor!==ns[i].floor){const m=(ns[i-1].type==='elevator'||ns[i].type==='elevator')?'elevator':'stairs';s.push(`Take the ${m} to Floor ${flabel(ns[i].floor)}`)}}s.push(`Arrive at ${b.label}`);
  $('steps').innerHTML=s.map(x=>`<div class="step">${esc(x)}</div>`).join('');
}
$('go').onclick=()=>{const a=$('from').value,b=$('to').value;if(!a||!b){$('status').textContent='Choose both locations.';return}const p=dijkstra(a,b);if(!p){path=[];drawRoute();$('summary').innerHTML='<b>No route found</b><div class="muted">A graph connection may still be missing.</div>';$('steps').innerHTML='';$('status').textContent='No route found.';return}path=p;setFloor(nodeById(a).floor);describe(p);$('status').textContent='Route found.'};
$('swap').onclick=()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a};
$('clear').onclick=()=>{path=[];$('from').value='';$('to').value='';drawRoute();$('summary').innerHTML='<b>No route yet</b><div class="muted">Choose a start and destination.</div>';$('steps').innerHTML='';$('status').textContent='Choose two locations.'};

loadGraph();
</script>
</body>
</html>
